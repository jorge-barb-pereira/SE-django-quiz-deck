name: Django checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python tools/audit_sources.py
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test game --verbosity 2
      - run: python manage.py migrate --noinput
      - run: python manage.py seed_demo
      - run: python manage.py collectstatic --noinput
      - name: Deployment configuration checks
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_DEBUG: '0'
          DJANGO_SECRET_KEY: ci-only-example-key-with-more-than-fifty-characters-never-use-in-production
          DJANGO_ALLOWED_HOSTS: localhost
